<!DOCTYPE html>
<html>
    <head>
        <title>ZYMA TV - Abuja No.11 Studio</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
        }

            header {
                background: #c00;
                padding: 15px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

                header img {
                    width: 60px;
                    background: white;
                    border-radius: 10px;
                    padding: 5px;
                }

                    nav a {
                        color: white;
                        margin: 0px 10px;
                        text-decoration: none;
                        font-weight: bold;
                }

                        .hero {
                            padding: 40px 20px;
                        }

                            .video-box {
                                max-width: 700px;
                                margin: 20px auto;
                                background: black;
                                border-radius: 15px;
                                overflow: hidden;
                                border: 3px solid #c00
                            }
                            

        </style>
    </head>

    <body>
        <header>
            <img src="zyma.png" alt="tv-studio-app">
            <nav><a href="index.html">Home</a>
                <a href="programs.html">Program</a>
                <a href="studio.html">Studio Login</a>
            </nav>
        </header>

        <div class="hero">
            <h1>Welcome to ZYMA TV</h1>
            <p>Abuja's Hottest Tv studio - Entertainment | News | Shows</p>
            <div class="video-box">
                <video id="mainVideo" controls width="100%" poster="zyma.png"></video>
            </div>
            <h3>Live Programs</h3>
        </div>
        <script>
            fetch('http://localhost:5000/videos').then(r=>r.json()).then(videos=>{
                if(videos.length>0)
                document.getElementById('mainVideo').src='http://localhost:5000'+vidoes[0].url
            })
        </script>
    </body>
</html>
