<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZYMA TV - LIVE | Abuja</title>
</a>

<header>
    <img src="zyma_studio_logo.png" alt="ZYMA Studio Logo"  style="width: 120px">
</header>
    <style>
        body {
            margin:0;
            font-family:Arial;
            background:#0a0a0a;
            color:white
        }
        header {
            background:#c00;
            padding:15px 25px;
            display:flex;
            align-items:center;
            gap:15px;
            justify-content:space-between;
        }
        header h1 {
            margin:0;
            font-size:22px;
            letter-spacing:2px;
        }
        .live-badge {
            background:white;
            color:#c00;
            padding:5px 15px;
            border-radius:20px;
            font-weight:bold;
            animation:blink 1s infinite;
        }
        @keyframes blink {
            0%,100%{opacity:1}50%{opacity:0.5}
        }
        .player-box {
            padding:20px;
            max-width:900px;
            margin:auto
        }
        iframe {
            width:100%;
            height:500px;
            border-radius:12px;
            border:2px solid #333;
        }
        #liveTitle {
            color:#ffcc00;
            margin-top:15px;
        }
        .schedule {
            max-width:900px;
            margin:20px auto;
            background:#1a1a1a;
            padding:20px;
            border-radius:12px;
        }
        .program {
            padding:12px;
            border-bottom:1px solid #333;
            display:flex;
            justify-content:space-between;
        }
        .program.live {
            color:#00ff00;
            font-weight:bold
        }
        img {
            height:40px;
        }
    </style>
</head>
<body>
<div class="schedule">
  <h3>🔴 Live Chat</h3>
  <div id="chatBox" style="height:200px;overflow-y:auto;background:#000;padding:10px;border-radius:8px"></div>
  <div style="display:flex;gap:5px;margin-top:10px">
    <input id="chatName" placeholder="Your name" style="width:30%">
    <input id="chatText" placeholder="Type message..." style="flex:1">
    <button onclick="sendChat()">Send</button>
  </div>
</div>
    <script src="app.js"></script>
</body>
</html>
